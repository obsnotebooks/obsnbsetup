  <script id="1" type="text/markdown">
    # *Setting up*<br>More Advanced GitHub &amp; GitHub Pages

    - if you've made one, delete your `docs` folder
    - change the build script in your `package.json` file to match this:
    > ```json
    > {
    >   "dependencies": {
    >     "@observablehq/notebook-kit": "latest"
    >   },
    >   "scripts": {
    >     "preview": "notebooks preview --root nbks",
    >     "build": "notebooks build --root nbks --out ../dist -- *.html"
    >   }
    > }
    > ```
    - copy this text and create a file containing it your text editor:

    > ```yaml
    > name: Deploy
    > on:
    >   workflow_call: {}
    >   workflow_dispatch: {}
    >   push:
    >     branches: [main]
    >
    > jobs:
    >   deploy:
    >     runs-on: ubuntu-latest
    >     permissions:
    >       pages: write
    >       id-token: write
    >     environment:
    >       name: github-pages
    >       url: \${{ steps.deployment.outputs.page_url }}
    >     steps:
    >       - uses: actions/checkout@v6
    >       - uses: actions/setup-node@v6
    >         with:
    >           node-version: 24
    >           cache: npm
    >       - run: npm ci
    >       - run: npm run build
    >       - uses: actions/configure-pages@v6
    >       - uses: actions/upload-pages-artifact@v5
    >         with:
    >           path: ./dist
    >       - name: Deploy
    >         id: deployment
    >         uses: actions/deploy-pages@v5
    > ```
    
    - save as `.github/workflows/deploy.yml` in your project folder (creating the folders as necessary)
    > ```
    > git add .
    > git commit -m "add deploy workflow"
    > git push
    > ```
    - go to GitHub and open your project’s repository. Click the ‘Settings’ tab.
    - click the ‘Pages’ item from side bar on the left.
    - change ‘Build and deployment’ to ‘GitHub Actions’ (if it isn’t already set that way).
    - you may see a failed deployment at this stage but don’t worry about it (yet). The next time you make a change to your project, the site will be built and deployed.
    - or, if you click the ‘Actions’ tab, where you may see the failed deployment. Ignore it and click 'Deploy' on the left. You can now manually trigger a deployment by clicking the 'Run workflow' button on the right. This will build and deploy your site, and you can see the progress in the log.
    - And, if you go to the GitHub repo -> Settings -> Pages again, you will see the URL for your project’s site, ready to be accessed publicly on the web. The URL will be of the form:<br>&nbsp;`https://<your-user-name>.github.io/<repo-name>`.
  </script>
  <script id="51" type="module">
    // Add copy buttons to all code blocks
    {
      const style = html`<style>
        pre {
          position: relative;
        }
        .copy-btn {
          position: absolute;
          top: 6px;
          right: 6px;
          padding: 3px 10px;
          font-size: 12px;
          cursor: pointer;
          background: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          opacity: 0.7;
          transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 1; }
        .copy-btn.copied {
          background: #d4edda;
          border-color: #28a745;
          color: #28a745;
        }
      </style>`;
      document.head.append(style);

      function addCopyButtons() {
        document.querySelectorAll("pre").forEach((pre) => {
          if (pre.querySelector(".copy-btn")) return; // skip if already added
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          btn.addEventListener("click", () => {
            const code = pre.querySelector("code")?.innerText ?? pre.innerText;
            navigator.clipboard.writeText(code).then(() => {
              btn.textContent = "Copied!";
              btn.classList.add("copied");
              setTimeout(() => {
                btn.textContent = "Copy";
                btn.classList.remove("copied");
              }, 2000);
            });
          });
          pre.append(btn);
        });
      }

      // Run once and also observe for dynamically rendered cells
      addCopyButtons();
      const observer = new MutationObserver(addCopyButtons);
      observer.observe(document.body, {childList: true, subtree: true});
      invalidation.then(() => observer.disconnect());
    }
  </script>
