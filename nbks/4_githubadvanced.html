    # *Setting up*<br>More Advanced GitHub &amp; GitHub Pages

    - if you've made one, delete your `docs` folder
    - change the build script in your `package.json` file to match this:
    > ```json
    > {
    >   "dependencies": {
    >     "@observablehq/notebook-kit": "^2.1.5"
    >   },
    >   "scripts": {
    >     "preview": "notebooks preview --root nbks",
    >     "build": "notebooks build --root nbks --out ../dist -- *.html"
    >   }
    > }
    > ```
    - copy this text and create a file containing it your text editor:

    > ```yaml
    > name: Deploy
    > on:
    >   workflow_call: {}
    >   workflow_dispatch: {}
    >   push:
    >     branches: [main]
    >
    > jobs:
    >   deploy:
    >     runs-on: ubuntu-latest
    >     permissions:
    >       pages: write
    >       id-token: write
    >     environment:
    >       name: github-pages
    >       url: \${{ steps.deployment.outputs.page_url }}
    >     steps:
    >       - uses: actions/checkout@v6
    >       - uses: actions/setup-node@v6
    >         with:
    >           node-version: 24
    >           cache: npm
    >       - run: npm ci
    >       - run: npm run build
    >       - uses: actions/configure-pages@v6
    >       - uses: actions/upload-pages-artifact@v5
    >         with:
    >           path: ./dist
    >       - name: Deploy
    >         id: deployment
    >         uses: actions/deploy-pages@v5
    > ```
    
    - save as `.github/workflows/deploy.yml` in your project folder (creating the folders as necessary)
    > ```
    > git add .
    > git commit -m "add deploy workflow"
    > git push
    > ```
    - go to GitHub and open your project’s repository. Click the ‘Settings’ tab.
    


  </script>
  <script id="14" type="text/markdown">
    #### Setup GitHub Pages to build and deploy your site whenever you `push` new changes
    1. Click this link to [a file that helps publish your site](https://github.com/framework-dev/useful_files/blob/main/publish.yml).
    2. Click the ‘Download (icon)’ button to download the file and then move it into your project directory.
    3. **TODO >>> this needs updating <<<** Now, from the Terminal command line, *in* your project directory, type these two commands:<br>&nbsp;`mkdir -p .github/workflows/`<br>&nbsp;`mv publish.yml .github/workflows/`<br>*These two commands do the following: 1) make a directory called* `workflows` *inside a (not-always-visible) directory called* `.github` *and 2) move the* `publish.yml` *file that you put into your project directory into the* `workflows` *folder.*
    4. Then, `commit` and `push` these changes to GitHub with these commands:<br>&nbsp;`git add .`<br>&nbsp;`git commit -m "add publish workflow"`<br>&nbsp;`git push`<br>*NOTE ... that these are the three commands (ideally with a different* `-m "message"` *each time) that you will issue whenever you’ve made significant changes to files in your project folder and you want to push them to your GitHub repository where they will be published.*

    You have added a `publish.yml` file to a special directory where GitHub will find it and use it to build a website once you have done a little more to set up GitHub Pages, as follows:
    1. Go to GitHub and open your project’s repository. Click the ‘Settings’ tab.
    2. Click the ‘Pages’ item from side bar on the left.
    3. Under ‘Build and deployment’ change ‘Deploy from a branch’ to ‘GitHub Actions’.

    You may see errors at this stage but don’t worry about them (yet). The next time you make a change to your project, the site will be built and deployed. And, if you go to the GitHub repo -> Settings -> Pages again, you will see the URL for your project’s site, ready to be accessed publicly on the web. The URL will be of the form:<br>&nbsp;`https://<your-user-name>.github.io/<repo-name>`.
    <!-- - need to create or copy: `.github/workflows/publish.yml` into your project
    - make sure workflows are triggered correctly -->

    <!--
    git init
    copy .github/workflows/publish.yml from an existing repo
    git add *
    git commit -m "first commit"
    -->

  <script id="51" type="module">
    // Add copy buttons to all code blocks
    {
      const style = html`<style>
        pre {
          position: relative;
        }
        .copy-btn {
          position: absolute;
          top: 6px;
          right: 6px;
          padding: 3px 10px;
          font-size: 12px;
          cursor: pointer;
          background: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          opacity: 0.7;
          transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 1; }
        .copy-btn.copied {
          background: #d4edda;
          border-color: #28a745;
          color: #28a745;
        }
      </style>`;
      document.head.append(style);

      function addCopyButtons() {
        document.querySelectorAll("pre").forEach((pre) => {
          if (pre.querySelector(".copy-btn")) return; // skip if already added
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          btn.addEventListener("click", () => {
            const code = pre.querySelector("code")?.innerText ?? pre.innerText;
            navigator.clipboard.writeText(code).then(() => {
              btn.textContent = "Copied!";
              btn.classList.add("copied");
              setTimeout(() => {
                btn.textContent = "Copy";
                btn.classList.remove("copied");
              }, 2000);
            });
          });
          pre.append(btn);
        });
      }

      // Run once and also observe for dynamically rendered cells
      addCopyButtons();
      const observer = new MutationObserver(addCopyButtons);
      observer.observe(document.body, {childList: true, subtree: true});
      invalidation.then(() => observer.disconnect());
    }
  </script>
